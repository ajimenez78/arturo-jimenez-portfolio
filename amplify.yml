version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - npm ci
    build:
      commands:
        - test -n "$OPENAI_API_KEY" || (echo "OPENAI_API_KEY is not configured for this Amplify branch" && exit 1)
        - env | grep -E '^OPENAI_API_KEY=' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
